        title: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [school, classroom, private] }
        tags:
          type: array
          items: { type: string }
        retentionType: { $ref: '#/components/schemas/RetentionType' }
    DocumentUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        folderId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        visibility: { type: string, enum: [school, classroom, private] }
        tags:
          type: array
          items: { type: string }

    DocumentVersion:
      type: object
      properties:
        id: { type: string, format: uuid }

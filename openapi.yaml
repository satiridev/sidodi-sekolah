openapi: 3.0.3
info:
  title: Arsip Digital Sekolah API
  version: 0.1.0
  description: |
    API SaaS arsip digital sekolah (compliance-first).
    Mencakup endpoint Tahap 1 (MVP) dan Tahap 2 (fase lanjutan).
    Autentikasi: session cookie (`cookieAuth`) atau Bearer token (`bearerAuth`).
    Semua endpoint tenant memerlukan konteks `schoolId` + pemeriksaan role via membership.
servers:
  - url: https://api.arsip-sekolah.id/api/v1
    description: Production
  - url: http://localhost:3001/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Schools
  - name: Members
  - name: SK Documents
  - name: Academic
  - name: Folders
  - name: Documents
  - name: Uploads
  - name: Versioning
  - name: Retention
  - name: Sharing
  - name: Compliance
  - name: Audit
  - name: Notifications
  - name: Search
  - name: Billing
  - name: SSO
  - name: Backups
  - name: On-Prem Agents
  - name: E-Ijazah
  - name: E-Raport
  - name: Finance
  - name: Analytics
  - name: Integrations
  - name: System
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ===================== Auth =====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204': { description: Logged out }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Kirim email reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password dengan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password updated }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verifikasi email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Verified }
  /auth/me:
    get:
      tags: [Auth]
      summary: Profil user + daftar membership
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  memberships:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===================== Schools =====================
  /schools:
    post:
      tags: [Schools]
      summary: Buat sekolah (pembuat menjadi headmaster)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                npsn: { type: string }
                address: { type: string }
                city: { type: string }
                province: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/School' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /schools/{schoolId}:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Schools]
      summary: Detail sekolah
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/School' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Schools]
      summary: Update profil sekolah
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/School' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /schools/slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Schools]
      summary: Info minimal sekolah (landing undangan)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  slug: { type: string }
                  logoUrl: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
  /schools/{schoolId}/storage:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Schools]
      summary: Kuota & pemakaian storage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotaBytes: { type: integer, format: int64 }
                  usedBytes: { type: integer, format: int64 }
                  maxFileSizeBytes: { type: integer, format: int64 }
  /schools/{schoolId}/settings:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    patch:
      tags: [Schools]
      summary: Update setting sekolah (mis. batas ukuran file)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxFileSizeBytes: { type: integer, format: int64 }
                timezone: { type: string }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===================== Members =====================
  /schools/{schoolId}/members:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Members]
      summary: Daftar anggota sekolah
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Membership' }
  /schools/{schoolId}/members/invite:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    post:
      tags: [Members]
      summary: Undang user ke sekolah
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '201': { description: Invitation sent }
        '403': { $ref: '#/components/responses/Forbidden' }
  /schools/{schoolId}/members/{membershipId}:
    parameters:
      - { $ref: '#/components/parameters/SchoolIdPath' }
      - { $ref: '#/components/parameters/MembershipIdPath' }
    patch:
      tags: [Members]
      summary: Ubah role/status anggota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
                status: { $ref: '#/components/schemas/MembershipStatus' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Members]
      summary: Hapus anggota
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Members]
      summary: Preview undangan
      security: []
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Members]
      summary: Terima undangan
      responses:
        '200': { description: Joined }
        '410': { description: Invitation expired }

  # ===================== SK Documents =====================
  /schools/{schoolId}/sk-documents:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [SK Documents]
      summary: Daftar SK
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SKDocument' }
    post:
      tags: [SK Documents]
      summary: Unggah SK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, issuedDate, storageKey]
              properties:
                title: { type: string }
                number: { type: string }
                issuedDate: { type: string, format: date }
                storageKey: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SKDocument' }
  /sk-documents/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [SK Documents]
      summary: Update SK
      responses:
        '200': { description: OK }
    delete:
      tags: [SK Documents]
      summary: Hapus SK
      responses:
        '204': { description: Deleted }

  # ===================== Academic =====================
  /schools/{schoolId}/academic-years:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Academic]
      summary: Daftar tahun ajaran
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AcademicYear' }
    post:
      tags: [Academic]
      summary: Buat tahun ajaran
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name: { type: string, example: "2025/2026" }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicYear' }
  /academic-years/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Academic]
      summary: Detail tahun ajaran
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicYear' }
    patch:
      tags: [Academic]
      summary: Update tahun ajaran
      responses:
        '200': { description: OK }
    delete:
      tags: [Academic]
      summary: Hapus tahun ajaran
      responses:
        '204': { description: Deleted }
  /academic-years/{id}/activate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Academic]
      summary: Aktifkan tahun ajaran
      responses:
        '200': { description: Activated }
  /academic-years/{id}/semesters:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Academic]
      summary: Daftar semester
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Semester' }
    post:
      tags: [Academic]
      summary: Buat semester
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, term]
              properties:
                name: { type: string }
                term: { $ref: '#/components/schemas/AcademicTerm' }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Semester' }
  /semesters/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Academic]
      summary: Detail semester
      responses:
        '200': { description: OK }
    patch:
      tags: [Academic]
      summary: Update semester
      responses:
        '200': { description: OK }
    delete:
      tags: [Academic]
      summary: Hapus semester
      responses:
        '204': { description: Deleted }
  /schools/{schoolId}/classrooms:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Academic]
      summary: Daftar kelas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Classroom' }
    post:
      tags: [Academic]
      summary: Buat kelas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academicYearId, name, gradeLevel]
              properties:
                academicYearId: { type: string, format: uuid }
                name: { type: string, example: "7A" }
                gradeLevel: { type: integer }
                homeroomTeacherMembershipId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classroom' }
  /classrooms/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Academic]
      summary: Detail kelas
      responses:
        '200': { description: OK }
    patch:
      tags: [Academic]
      summary: Update kelas
      responses:
        '200': { description: OK }
    delete:
      tags: [Academic]
      summary: Hapus kelas
      responses:
        '204': { description: Deleted }
  /schools/{schoolId}/document-types:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Academic]
      summary: Daftar jenis dokumen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentType' }
    post:
      tags: [Academic]
      summary: Buat jenis dokumen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentType' }
  /document-types/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Academic]
      summary: Detail jenis dokumen
      responses:
        '200': { description: OK }
    patch:
      tags: [Academic]
      summary: Update jenis dokumen
      responses:
        '200': { description: OK }
    delete:
      tags: [Academic]
      summary: Hapus jenis dokumen
      responses:
        '204': { description: Deleted }

  # ===================== Folders =====================
  /schools/{schoolId}/folders/tree:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Folders]
      summary: Pohon folder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folder' }
  /schools/{schoolId}/folders/generate:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    post:
      tags: [Folders]
      summary: Auto-generate struktur folder (TA > Semester > Kelas > Jenis)
      responses:
        '201': { description: Generated }
        '403': { $ref: '#/components/responses/Forbidden' }
  /folders/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Folders]
      summary: Detail folder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
    patch:
      tags: [Folders]
      summary: Rename / pindah folder
      responses:
        '200': { description: OK }
    delete:
      tags: [Folders]
      summary: Hapus folder (harus kosong)
      responses:
        '204': { description: Deleted }
        '409': { description: Folder tidak kosong }
  /folders/{id}/contents:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Folders]
      summary: Isi folder (sub-folder + dokumen)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items: { $ref: '#/components/schemas/Folder' }
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
  /folders:
    post:
      tags: [Folders]
      summary: Buat folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId, name]
              properties:
                schoolId: { type: string, format: uuid }
                parentId: { type: string, format: uuid, nullable: true }
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }

  # ===================== Documents =====================
  /schools/{schoolId}/documents:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Documents]
      summary: Daftar dokumen + filter
      parameters:
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/LimitParam' }
        - { name: folderId, in: query, schema: { type: string, format: uuid } }
        - { name: documentTypeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DocStatus' } }
        - name: tags
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: false
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Document' }
  /documents:
    post:
      tags: [Documents]
      summary: Buat metadata dokumen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
  /documents/check-duplicate:
    post:
      tags: [Uploads]
      summary: Cek duplikat berdasarkan hash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentHash, schoolId]
              properties:
                schoolId: { type: string, format: uuid }
                contentHash: { type: string }
      responses:
        '200':
          description: Hasil cek
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate: { type: boolean }
                  documentId: { type: string, format: uuid, nullable: true }
  /policy/validate:
    post:
      tags: [Uploads]
      summary: Validasi pra-upload (ekstensi & ukuran)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId, fileName, sizeBytes]
              properties:
                schoolId: { type: string, format: uuid }
                documentTypeId: { type: string, format: uuid }
                fileName: { type: string }
                sizeBytes: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  reasons:
                    type: array
                    items: { type: string }
  /documents/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Documents]
      summary: Detail dokumen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Documents]
      summary: Update metadata dokumen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdate' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Documents]
      summary: Soft delete (pindah ke trash)
      responses:
        '204': { description: Deleted }
  /documents/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Documents]
      summary: Pulihkan dokumen
      responses:
        '200': { description: Restored }
  /documents/{id}/download:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Documents]
      summary: URL presigned download
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
  /documents/{id}/preview:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Documents]
      summary: URL presigned inline preview
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
  /documents/{id}/audit-trail:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Documents]
      summary: Riwayat aksi dokumen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }

  # ===================== Uploads =====================
  /uploads/initiate:
    post:
      tags: [Uploads]
      summary: Mulai sesi upload (validasi awal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId, fileName, mimeType, sizeBytes]
              properties:
                schoolId: { type: string, format: uuid }
                documentId: { type: string, format: uuid, nullable: true }
                documentTypeId: { type: string, format: uuid, nullable: true }

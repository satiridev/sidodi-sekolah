          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
  /schools/{schoolId}/students/import:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    post:
      tags: [E-Raport]
      summary: Impor siswa via CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '202': { description: Accepted }
  /students/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [E-Raport]
      summary: Detail siswa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
    patch:
      tags: [E-Raport]
      summary: Update siswa
      responses:
        '200': { description: OK }
    delete:
      tags: [E-Raport]
      summary: Hapus siswa
      responses:
        '204': { description: Deleted }
  /schools/{schoolId}/subjects:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [E-Raport]
      summary: Daftar mata pelajaran
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
    post:
      tags: [E-Raport]
      summary: Tambah mata pelajaran
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Subject' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
  /classrooms/{id}/grades:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [E-Raport]
      summary: Daftar nilai kelas
      parameters:
        - { name: subjectId, in: query, schema: { type: string, format: uuid } }
        - { name: term, in: query, schema: { $ref: '#/components/schemas/AcademicTerm' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Grade' }
    post:
      tags: [E-Raport]
      summary: Input nilai (upsert per siswa+mapel+term)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grade' }
  /classrooms/{id}/grades/bulk:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [E-Raport]
      summary: Input banyak nilai sekaligus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grades]
              properties:
                grades:
                  type: array
                  items: { $ref: '#/components/schemas/GradeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: integer }
  /classrooms/{id}/students:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [E-Raport]
      summary: Daftar siswa di kelas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentClassroom' }
    post:
      tags: [E-Raport]
      summary: Tugaskan siswa ke kelas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentIds]
              properties:
                studentIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  assigned: { type: integer }
  /classrooms/{id}/report-cards:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [E-Raport]
      summary: Daftar raport kelas
      parameters:
        - { name: semesterId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportCard' }
  /classrooms/{id}/report-cards/generate:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [E-Raport]
      summary: Generate raport kelas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [semesterId]
              properties:
                semesterId: { type: string, format: uuid }
                studentIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: { type: integer }
                  reportCards:
                    type: array
                    items: { $ref: '#/components/schemas/ReportCard' }
  /report-cards/{id}/pdf:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [E-Raport]
      summary: Unduh raport PDF
      responses:
        '200':
          description: OK
          content:
            application/pdf: { schema: { type: string, format: binary } }

  # ===================== Finance =====================
  /schools/{schoolId}/finance/archives:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Finance]
      summary: Daftar arsip keuangan
      parameters:
        - name: academicYearId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema:
            type: string
            enum: [RKAS, SPJ, KUITANSI, LAPORAN_BOS, BUKU_KAS, PAJAK, LAINNYA]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FinanceArchive' }
    post:
      tags: [Finance]
      summary: Tambah arsip keuangan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceArchiveCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceArchive' }
  /schools/{schoolId}/finance/summary:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Finance]
      summary: Ringkasan keuangan per tahun ajaran
      parameters:
        - name: academicYearId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummary' }
  /schools/{schoolId}/finance/export:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Finance]
      summary: Paket ekspor audit (ZIP)
      parameters:
        - name: academicYearId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/zip: { schema: { type: string, format: binary } }

  # ===================== Analytics =====================
  /analytics/school:
    get:
      tags: [Analytics]
      summary: Metrik sekolah
      parameters:
        - { name: schoolId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolAnalytics' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /analytics/network:
    get:
      tags: [Analytics]
      summary: Metrik lintas sekolah (yayasan/dinas)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAnalytics' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===================== Integrations =====================
  /schools/{schoolId}/api-keys:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Integrations]
      summary: Daftar API key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [Integrations]
      summary: Buat API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Created }
  /api-keys/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      tags: [Integrations]
      summary: Cabut API key
      responses:
        '204': { description: Revoked }
  /schools/{schoolId}/webhooks:
    parameters: [{ $ref: '#/components/parameters/SchoolIdPath' }]
    get:
      tags: [Integrations]
      summary: Daftar webhook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
    post:
      tags: [Integrations]
      summary: Buat webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
  /integrations/dapodik/sync:
    post:
      tags: [Integrations]
      summary: Sinkronisasi Dapodik
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId]
              properties:
                schoolId: { type: string, format: uuid }
      responses:
        '202': { description: Accepted }
  /integrations/dapodik/syncs:
    get:
      tags: [Integrations]
      summary: Riwayat sinkronisasi Dapodik
      parameters:
        - { name: schoolId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }

  # ===================== System =====================
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number }
  /metrics:
    get:
      tags: [System]
      summary: Metrik internal
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: arsip_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipIdPath:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Belum terautentikasi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Tidak punya izin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UserResponse:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true, nullable: true }
    Paginated:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }

    UserRole:
      type: string
      enum: [headmaster, head_of_administration, teacher, operator, auditor]
    MembershipStatus:
      type: string
      enum: [invited, active, suspended]
    AcademicTerm:
      type: string
      enum: [odd, even]
    DocStatus:
      type: string
      enum: [active, archived, pending_deletion, deleted]
    RetentionType:
      type: string
      enum: [financial_5y, academic_permanent, custom]
    PlanCode:
      type: string
      enum: [trial, basic, pro]
    EijazahStatus:
      type: string
      enum: [draft, issued, revoked]
    StudentStatus:
      type: string
      enum: [active, graduated, transferred, inactive]

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/PlanCode' }
        name: { type: string }
        priceYearlyIdr: { type: integer }
        storageQuotaBytes: { type: integer, format: int64 }
        maxUsers: { type: integer }
        features: { type: object, additionalProperties: true, nullable: true }
        isActive: { type: boolean }

    School:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        npsn: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        storageQuotaBytes: { type: integer, format: int64 }
        storageUsedBytes: { type: integer, format: int64 }
        maxFileSizeBytes: { type: integer, format: int64 }
        status: { type: string, enum: [active, suspended] }
        analyticsOptIn: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SchoolUpdate:
      type: object
      properties:
        name: { type: string }
        npsn: { type: string }
        address: { type: string }
        city: { type: string }
        province: { type: string }
        phone: { type: string }
        email: { type: string }
        logoUrl: { type: string }
        analyticsOptIn: { type: boolean }

    AnalyticsTrendPoint:
      type: object
      properties:
        month: { type: string, example: '2026-10' }
        count: { type: integer }

    SchoolAnalytics:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        school:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            planCode: { $ref: '#/components/schemas/PlanCode' }
            status: { type: string, enum: [active, suspended] }
            analyticsOptIn: { type: boolean }
            createdAt: { type: string, format: date-time }
        compliance:
          type: object
          properties:
            score: { type: number }
            status: { type: string }
            checks:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  label: { type: string }
                  score: { type: number }
                  pass: { type: boolean }
            trend:
              type: array
              items:
                type: object
                properties:
                  score: { type: number }
                  computedAt: { type: string, format: date-time }
        storage:
          type: object
          properties:
            usedBytes: { type: string }
            quotaBytes: { type: string }
            remainingBytes: { type: string }
            usagePercent: { type: number }
            maxFileSizeBytes: { type: string }
        documents:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            archived: { type: integer }
            pendingDeletion: { type: integer }
            legalHold: { type: integer }
            expiredRetention: { type: integer }
            nearingRetention: { type: integer }
        folders: { type: integer }
        memberships:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
        students:
          type: object
          properties:
            active: { type: integer }
            graduated: { type: integer }
        uploads:
          type: object
          properties:
            totalVersions: { type: integer }
            totalSizeBytes: { type: string }
            trend:
              type: array
              items: { $ref: '#/components/schemas/AnalyticsTrendPoint' }
        documentTypes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, nullable: true }
              name: { type: string }
              code: { type: string, nullable: true }
              count: { type: integer }

    NetworkAnalytics:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        scope: { type: string, enum: [network] }
        schools:
          type: object
          properties:
            optedIn: { type: integer }
            byPlan:
              type: array
              items:
                type: object
                properties:
                  plan: { $ref: '#/components/schemas/PlanCode' }
                  planName: { type: string }
                  count: { type: integer }
        storage:
          type: object
          properties:
            usedBytes: { type: string }
            quotaBytes: { type: string }
            remainingBytes: { type: string }
            usagePercent: { type: number }
        documents:
          type: object
          properties:
            total: { type: integer }
            legalHold: { type: integer }
        memberships:
          type: object
          properties:
            active: { type: integer }
        students:
          type: object
          properties:
            active: { type: integer }
        compliance:
          type: object
          properties:
            schoolsWithScore: { type: integer }
            averageScore: { type: number, nullable: true }
            distribution:
              type: array
              items:
                type: object
                properties:
                  status: { type: string, enum: [baik, cukup, perlu_perbaikan] }
                  count: { type: integer }
        uploads:
          type: object
          properties:
            trend:
              type: array
              items: { $ref: '#/components/schemas/AnalyticsTrendPoint' }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        planCode: { $ref: '#/components/schemas/PlanCode' }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        seats: { type: integer, nullable: true }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        isEmailVerified: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        joinedAt: { type: string, format: date-time, nullable: true }

    SKDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        title: { type: string }
        number: { type: string, nullable: true }
        issuedDate: { type: string, format: date }
        storageKey: { type: string }
        isActive: { type: boolean }

    AcademicYear:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        isActive: { type: boolean }

    Semester:
      type: object
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        term: { $ref: '#/components/schemas/AcademicTerm' }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        isActive: { type: boolean }

    Classroom:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        gradeLevel: { type: integer }
        homeroomTeacherMembershipId: { type: string, format: uuid, nullable: true }

    DocumentType:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        code: { type: string }
        description: { type: string, nullable: true }
        retentionType: { $ref: '#/components/schemas/RetentionType' }
        retentionMonths: { type: integer, nullable: true }
        allowedExtensions:
          type: array
          items: { type: string }
        maxSizeBytes: { type: integer, format: int64, nullable: true }
        requiresLegalHold: { type: boolean }
        isSystem: { type: boolean }
    DocumentTypeInput:
      type: object
      required: [name, code, retentionType, allowedExtensions]
      properties:
        name: { type: string }
        code: { type: string }
        description: { type: string }
        retentionType: { $ref: '#/components/schemas/RetentionType' }
        retentionMonths: { type: integer, nullable: true }
        allowedExtensions:
          type: array
          items: { type: string }
        maxSizeBytes: { type: integer, format: int64 }
        requiresLegalHold: { type: boolean }

    Folder:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        academicYearId: { type: string, format: uuid, nullable: true }
        semesterId: { type: string, format: uuid, nullable: true }
        classroomId: { type: string, format: uuid, nullable: true }
        documentTypeId: { type: string, format: uuid, nullable: true }
        path: { type: string }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        folderId: { type: string, format: uuid, nullable: true }
        documentTypeId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        ownerMembershipId: { type: string, format: uuid, nullable: true }
        visibility: { type: string, enum: [school, classroom, private] }
        tags:
          type: array
          items: { type: string }
        retentionType: { $ref: '#/components/schemas/RetentionType' }
        retentionExpiresAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/DocStatus' }
